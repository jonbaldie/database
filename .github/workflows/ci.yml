name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Go 1.26.9 fixes reachable standard-library vulnerabilities. It
          # also supports messgo v0.2.0 and makes quality results reproducible.
          go-version: 1.26.9
          cache: true
      - name: Production quality gate
        run: make quality
      - name: Install mutation tester
        run: go install github.com/quality-gates/mutago/v2/cmd/mutago@v2.10.24
      - name: Changed-code mutation threshold
        run: make mutation
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
